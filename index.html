<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>卡牌游戏测试客户端</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #222; color: #fff; }
    button { padding: 8px 16px; margin-right: 10px; font-size: 14px; cursor: pointer; }
    #log { margin-top: 20px; padding: 10px; background: #111; height: 400px; overflow-y: auto; font-family: monospace; line-height: 1.6; }
    .msg { color: #4CAF50; }
    .err { color: #f44336; }
  </style>
</head>
<body>
  <h1>2D 卡牌游戏 - 玩家客户端</h1>
  <button onclick="connectServer()">🔌 点击连接服务器</button>
  <button onclick="sendTest()">⚔️ 打出第一张手牌</button>
  <div id="log">等待连接...</div>

  <script>
    let ws;
    const logDiv = document.getElementById('log');

    function log(msg, className = '') {
      logDiv.innerHTML += `<div class="${className}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function connectServer() {
      ws = new WebSocket('ws://localhost:8080');
      
      ws.onopen = () => log('✅ 成功连上服务器！', 'msg');
      
      ws.onmessage = (e) => {
        const response = JSON.parse(e.data);
        
        if (response.type === 'SYSTEM') {
          log(`📩 系统: ${response.message}`, 'msg');
        } 
        else if (response.type === 'ERROR') {
          log(`❌ 错误: ${response.message}`, 'err');
        }
        else if (response.type === 'STATE_UPDATE') {
          const state = response.data;
          log(`🔄 === 第 ${state.turn} 回合 ===`, 'msg');
          log(`👉 当前行动方: ${state.currentTurnPlayerId === 'p1' ? '玩家 1 (Player_p1)' : '玩家 2 (Player_p2)'}`);
          
          state.players.forEach(p => {
            const isDead = p.hp === 0 ? " (💀 已阵亡)" : "";
            // 兼容新旧后端：如果有手牌数组就打印具体卡牌，否则打印手牌数量
            if (p.hand) {
              const handStr = p.hand.map(c => `${c.name}(${c.cost}费/伤${c.effect.value})`).join(', ');
              log(`   👤 ${p.name}: HP ${p.hp} | Mana ${p.mana}/${p.maxMana} | 牌库:${p.deckCount}张${isDead}`);
              log(`      🃏 手牌: [${handStr || '空'}]`);
            } else {
              log(`   👤 ${p.name}: HP ${p.hp} | Mana ${p.mana}/${p.maxMana}${isDead}`);
            }
          });
          
          if (state.state === 'ENDED') {
            log(`🏆 游戏结束！`, 'err');
          }
        }
      };
      
      ws.onerror = () => log('❌ 连接失败，请确认终端里的 node index.js 正在运行！', 'err');
      ws.onclose = () => log('🔌 连接已断开');
    }

    function sendTest() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        const action = {
          type: 'PLAY_CARD',
          payload: {} // 默认让服务器打出当前手牌里的第一张
        };
        ws.send(JSON.stringify(action));
      } else {
        log('还没连上呢，先点连接！', 'err');
      }
    }
  </script>
</body>
</html>
