<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>卡牌游戏测试客户端</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #222; color: #fff; margin: 0; overflow-x: hidden; user-select: none; }
    button { padding: 8px 16px; margin-right: 10px; font-size: 14px; cursor: pointer; border-radius: 4px; border: none; }
    .btn-connect { background: #2196F3; color: white; }
    .btn-end { background: #FF9800; color: white; font-weight: bold; }
    
    /* 🌊 全屏被水淹没的溺水特效层 */
    #water-overlay {
      display: none;
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(180deg, rgba(0, 105, 180, 0.35) 0%, rgba(0, 40, 90, 0.75) 100%);
      box-shadow: inset 0 0 100px #00e5ff;
      z-index: 999;
      pointer-events: none; /* 水幕允许鼠标穿透点击底下的牌 */
      flex-direction: column; justify-content: center; align-items: center;
      animation: wavePulse 0.6s infinite alternate ease-in-out;
    }
    @keyframes wavePulse {
      from { transform: scale(1); }
      to { transform: scale(1.02); }
    }
    #big-countdown {
      font-size: 160px; font-weight: 900; color: #00e5ff;
      text-shadow: 0 0 30px #00e5ff, 0 0 60px #004d80, 4px 4px 0px #000;
      line-height: 1;
    }
    #water-warning-text {
      font-size: 28px; font-weight: bold; color: #fff;
      text-shadow: 0 0 10px #000; margin-top: 10px;
      background: rgba(0, 0, 0, 0.5); padding: 8px 24px; border-radius: 20px;
    }

    /* 💤 全屏沉睡梦魇特效层（pointer-events: auto 彻底锁死底层，必须先点按钮醒来！） */
    #sleep-overlay {
      display: none;
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle, rgba(60, 0, 110, 0.88) 0%, rgba(10, 0, 25, 0.96) 100%);
      box-shadow: inset 0 0 120px #aa00ff;
      z-index: 1000; /* 比大水层级更高，优先阻挡屏幕 */
      pointer-events: auto;
      flex-direction: column; justify-content: center; align-items: center;
    }
    #sleep-zzz {
      font-size: 90px; font-weight: 900; color: #e040fb;
      text-shadow: 0 0 25px #aa00ff, 0 0 50px #000;
      margin-bottom: 10px;
    }
    #sleep-timer-text {
      font-size: 26px; color: #ffb74d; font-weight: bold; margin-bottom: 25px;
      text-shadow: 0 0 10px #000;
    }
    #btn-struggle {
      background: linear-gradient(135deg, #aa00ff, #ff007f);
      color: #fff; font-size: 28px; font-weight: 900;
      padding: 22px 45px; border-radius: 50px;
      border: 4px solid #fff;
      box-shadow: 0 0 30px #e040fb, 0 8px 0 #4a0072;
      cursor: pointer; transition: transform 0.05s;
    }
    #btn-struggle:active {
      transform: scale(0.92) translateY(4px);
      box-shadow: 0 0 45px #ff4081, 0 2px 0 #4a0072;
    }

    #hand-area { margin-top: 20px; padding: 15px; background: #333; border-radius: 8px; min-height: 80px; }
    .card-btn { 
      background: #4CAF50; color: white; padding: 12px 16px; margin: 5px; 
      border-radius: 6px; font-weight: bold; border: 2px solid #81C784;
      transition: transform 0.1s;
    }
    .card-btn.black-flash {
      background: #1a1a1a; color: #ff1744; border: 2px solid #ff1744;
      box-shadow: 0 0 8px rgba(255, 23, 68, 0.6);
    }
    .card-btn.flood-card {
      background: #003366; color: #00e5ff; border: 2px solid #00e5ff;
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
    }
    .card-btn.sleep-card {
      background: #311b92; color: #ea80fc; border: 2px solid #ea80fc;
      box-shadow: 0 0 12px rgba(234, 128, 252, 0.7);
    }
    .card-btn:hover { transform: translateY(-5px); }

    #qte-modal {
      display: none; margin-top: 15px; padding: 20px; background: #111; 
      border: 2px solid #ff1744; border-radius: 8px; text-align: center;
      box-shadow: 0 0 20px rgba(255, 23, 68, 0.5);
    }
    #qte-bar {
      position: relative; width: 400px; height: 30px; background: #333; 
      margin: 15px auto; border-radius: 15px; overflow: hidden; border: 2px solid #555;
    }
    #qte-target {
      position: absolute; left: 40%; width: 20%; height: 100%; 
      background: #ff1744; box-shadow: 0 0 12px #ff1744;
    }
    #qte-pointer {
      position: absolute; left: 0%; width: 6px; height: 100%; 
      background: #fff; box-shadow: 0 0 8px #fff;
    }
    .btn-strike {
      background: #ff1744; color: white; font-size: 18px; font-weight: bold;
      padding: 10px 30px; border-radius: 6px; box-shadow: 0 0 10px #ff1744;
    }

    #log { margin-top: 20px; padding: 10px; background: #111; height: 300px; overflow-y: auto; font-family: monospace; line-height: 1.6; }
    .msg { color: #4CAF50; }
    .err { color: #f44336; }
    .flood-msg { color: #00e5ff; font-weight: bold; }
    .sleep-msg { color: #ea80fc; font-weight: bold; }
  </style>
</head>
<body>
  <!-- 🌊 全屏被水淹没特效 -->
  <div id="water-overlay">
    <div id="big-countdown">6</div>
    <div id="water-warning-text">🌊 正在被大水淹没！快出牌！！ 🌊</div>
  </div>

  <!-- 💤 全屏大睡挣扎特效（狂按 12 次惊醒） -->
  <div id="sleep-overlay">
    <div id="sleep-zzz">💤 陷入沉睡 Zzz...</div>
    <div id="sleep-timer-text">⚠️ 距离彻底睡死跳过回合还剩：<span id="sleep-countdown">2.5</span> 秒！</div>
    <button id="btn-struggle" onclick="handleStruggleClick()">
      💥 狂按咬舌尖惊醒！(<span id="struggle-count">0</span> / 12) 💥
    </button>
    <div style="margin-top: 15px; color: #ccc; font-size: 15px;">（注：强行挣脱催眠将受到 8 点反噬伤害，不按则直接跳过本回合！）</div>
  </div>

  <h1>2D 卡牌游戏 - 玩家客户端</h1>
  <div>
    <button class="btn-connect" onclick="connectServer()">🔌 连接服务器</button>
    <button class="btn-end" onclick="endTurn()">⏳ 结束回合 (End Turn)</button>
  </div>

  <div id="hand-area">
    <div>🃏 <strong>点击下方卡牌直接打出：</strong></div>
    <div id="cards-container" style="margin-top: 10px;">等待开局发牌...</div>
  </div>

  <div id="qte-modal">
    <div style="color: #ff1744; font-weight: bold; font-size: 18px;">⚡ 【黑闪】空间扭曲判定！在白线进入红色区域时按下！ ⚡</div>
    <div id="qte-bar">
      <div id="qte-target"></div>
      <div id="qte-pointer"></div>
    </div>
    <button class="btn-strike" onclick="confirmBlackFlash()">⚡ 斩击！(Strike)</button>
  </div>

  <div id="log">等待连接...</div>

  <script>
    let ws;
    let myPlayerId = null;
    let currentIsMyTurn = false;
    let currentMyMana = 0;
    let lastTurnNumber = 0;

    let qteAnimationId = null;
    let pointerPos = 0;
    let direction = 1;
    let pendingCardId = null;

    let floodIntervalId = null;
    let sleepIntervalId = null;
    let struggleClicks = 0;
    const REQUIRED_STRUGGLE_CLICKS = 12;

    const logDiv = document.getElementById('log');
    const cardsContainer = document.getElementById('cards-container');
    const qteModal = document.getElementById('qte-modal');
    const qtePointer = document.getElementById('qte-pointer');
    const waterOverlay = document.getElementById('water-overlay');
    const bigCountdown = document.getElementById('big-countdown');
    const sleepOverlay = document.getElementById('sleep-overlay');
    const sleepCountdownSpan = document.getElementById('sleep-countdown');
    const struggleCountSpan = document.getElementById('struggle-count');

    function log(msg, className = '') {
      logDiv.innerHTML += `<div class="${className}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function connectServer() {
      ws = new WebSocket('ws://localhost:8080');
      ws.onopen = () => log('✅ 成功连上服务器！', 'msg');
      
      ws.onmessage = (e) => {
        const response = JSON.parse(e.data);
        
        if (response.type === 'SYSTEM') {
          log(`📩 系统: ${response.message}`, 'msg');
          const match = response.message.match(/Player_(p\d+)/);
          if (match) myPlayerId = match[1];
        } 
        else if (response.type === 'ERROR') {
          log(`❌ 错误: ${response.message}`, 'err');
        }
        else if (response.type === 'STATE_UPDATE') {
          const state = response.data;
          const isNewTurn = (state.turn !== lastTurnNumber);
          lastTurnNumber = state.turn;
          currentIsMyTurn = (state.currentTurnPlayerId === myPlayerId);

          if (!currentIsMyTurn) {
            qteModal.style.display = 'none';
            if (qteAnimationId) cancelAnimationFrame(qteAnimationId);
          }

          // 如果已经不是沉睡状态（比如惊醒成功或回合跳过），关闭沉睡遮罩
          if (!state.isCurrentPlayerSleeping || !currentIsMyTurn) {
            stopSleepUI();
          }

          if (isNewTurn) {
            startFloodCountdownUI(state.turnTimeLimit, currentIsMyTurn);
            if (state.isCurrentPlayerSleeping) {
              startSleepStruggleUI(currentIsMyTurn);
            }
          }
          
          log(`🔄 === 第 ${state.turn} 回合 (${currentIsMyTurn ? '🟢 你的回合!' : '🔴 对手回合'}) ===`, 'msg');
          
          state.players.forEach(p => {
            const isMe = p.id === myPlayerId ? "【我】" : "【对手】";
            const isDead = p.hp === 0 ? " (💀 已阵亡)" : "";
            const floodTag = p.nextTurnFlooded ? ` [🌊下回合水淹${p.nextTurnFlooded}秒!]` : "";
            const sleepTag = p.nextTurnSleep ? ` [💤下回合陷入大睡!]` : "";
            log(`   👤 ${isMe} ${p.name}: HP ${p.hp} | 💎 Mana ${p.mana}/${p.maxMana}${floodTag}${sleepTag}${isDead}`);
            
            if (p.id === myPlayerId) {
              currentMyMana = p.mana;
              renderHandButtons(p.hand, currentIsMyTurn, p.mana);
            }
          });
          
          if (state.state === 'ENDED') {
            clearInterval(floodIntervalId);
            waterOverlay.style.display = 'none';
            stopSleepUI();
            log(`🏆 游戏结束！`, 'err');
            cardsContainer.innerHTML = '游戏已结束';
            qteModal.style.display = 'none';
          }
        }
      };
      
      ws.onerror = () => log('❌ 连接失败，请确认终端里的 node index.js 正在运行！', 'err');
      ws.onclose = () => log('🔌 连接已断开');
    }

    // 💤 启动【大睡】2.5秒狂点挣扎 UI
    function startSleepStruggleUI(isMyTurn) {
      stopSleepUI();
      if (isMyTurn) {
        struggleClicks = 0;
        struggleCountSpan.innerText = struggleClicks;
        sleepOverlay.style.display = 'flex';
        let remaining = 2.5;
        sleepCountdownSpan.innerText = remaining.toFixed(1);
        log('💤 糟糕！你中了【大睡】！快在 2.5 秒内狂点 12 次按钮挣脱沉睡！', 'sleep-msg');

        sleepIntervalId = setInterval(() => {
          remaining -= 0.1;
          if (remaining <= 0) {
            remaining = 0;
            stopSleepUI();
          }
          sleepCountdownSpan.innerText = remaining.toFixed(1);
        }, 100);
      } else {
        log('💤 对手陷入了你的【大睡】梦魇！正在拼命挣扎中（2.5秒判定）...', 'sleep-msg');
      }
    }

    function stopSleepUI() {
      if (sleepIntervalId) {
        clearInterval(sleepIntervalId);
        sleepIntervalId = null;
      }
      sleepOverlay.style.display = 'none';
    }

    // 玩家每次点击挣扎按钮
    function handleStruggleClick() {
      struggleClicks++;
      struggleCountSpan.innerText = struggleClicks;

      if (struggleClicks >= REQUIRED_STRUGGLE_CLICKS) {
        stopSleepUI();
        log('🩸 你疯狂咬破舌尖（-8 HP），强行从【大睡】中惊醒了过来！快出牌！', 'sleep-msg');
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'WAKE_UP' }));
        }
      }
    }

    function startFloodCountdownUI(timeLimitSeconds, isMyTurn) {
      clearInterval(floodIntervalId);
      waterOverlay.style.display = 'none';

      if (!timeLimitSeconds) return;

      if (isMyTurn) {
        waterOverlay.style.display = 'flex';
        let count = Math.ceil(timeLimitSeconds);
        bigCountdown.innerText = count;
        log(`🌊 咕噜咕噜... 你被【大水】淹没了！只剩 ${count} 秒！`, 'flood-msg');

        floodIntervalId = setInterval(() => {
          count--;
          if (count > 0) {
            bigCountdown.innerText = count;
          } else {
            clearInterval(floodIntervalId);
            waterOverlay.style.display = 'none';
          }
        }, 1000);
      } else {
        log(`🌊 对手正在被你的【大水】淹没（${timeLimitSeconds}秒倒计时中）...`, 'flood-msg');
      }
    }

    function renderHandButtons(hand, isMyTurn, currentMana) {
      if (!hand || hand.length === 0) {
        cardsContainer.innerHTML = '手牌打空啦！';
        return;
      }
      cardsContainer.innerHTML = '';
      hand.forEach(card => {
        const btn = document.createElement('button');
        
        if (card.effect.type === 'BLACK_FLASH') {
          btn.className = 'card-btn black-flash';
          btn.innerText = `${card.name} [💎${card.cost}费 | 💥伤${card.effect.value}]`;
        } else if (card.effect.type === 'FLOOD') {
          btn.className = 'card-btn flood-card';
          btn.innerText = `${card.name} [💎${card.cost}费 | 🌊淹${card.effect.value}秒]`;
        } else if (card.effect.type === 'SLEEP') {
          btn.className = 'card-btn sleep-card';
          btn.innerText = `${card.name} [💎${card.cost}费 | 💤跳回合/反噬${card.effect.value}]`;
        } else {
          btn.className = 'card-btn';
          btn.innerText = `${card.name} [💎${card.cost}费 | 💥伤${card.effect.value}]`;
        }
        
        if (!isMyTurn || currentMana < card.cost) {
          btn.style.opacity = '0.4';
        }
        
        btn.onclick = () => handleCardClick(card);
        cardsContainer.appendChild(btn);
      });
    }

    function handleCardClick(card) {
      if (!currentIsMyTurn) {
        log('⚠️ 还没轮到你的回合！', 'err');
        return;
      }
      if (currentMyMana < card.cost) {
        log(`⚠️ 法力值不足！需要 ${card.cost} 费`, 'err');
        return;
      }

      if (card.effect.type === 'BLACK_FLASH') {
        startBlackFlashQTE(card.id);
      } else {
        if (card.effect.type === 'FLOOD') {
          log(`🌊 你发动了【大水】！对手下回合将被水淹没 ${card.effect.value} 秒！`, 'flood-msg');
        } else if (card.effect.type === 'SLEEP') {
          log(`💤 你发动了传说控制卡【大睡】！对手下回合将陷入沉睡梦魇！`, 'sleep-msg');
        }
        sendPlayCard(card.id);
      }
    }

    function startBlackFlashQTE(cardId) {
      pendingCardId = cardId;
      qteModal.style.display = 'block';
      pointerPos = 0;
      direction = 1;

      if (qteAnimationId) cancelAnimationFrame(qteAnimationId);

      function animatePointer() {
        pointerPos += 1.2 * direction;
        if (pointerPos >= 98) {
          pointerPos = 98;
          direction = -1;
        } else if (pointerPos <= 0) {
          pointerPos = 0;
          direction = 1;
        }
        qtePointer.style.left = pointerPos + '%';
        qteAnimationId = requestAnimationFrame(animatePointer);
      }
      animatePointer();
    }

    function confirmBlackFlash() {
      if (qteAnimationId) cancelAnimationFrame(qteAnimationId);
      qteModal.style.display = 'none';

      const isHit = (pointerPos >= 40 && pointerPos <= 60);
      if (isHit) {
        log('⚡⚡ 【黑闪】判定成功！！空间发生扭曲，打出 25 点暴击伤害！', 'msg');
      } else {
        log('💨 【黑闪】判定失败！指针偏离核心区，伤害落空（0 伤）！', 'err');
      }

      sendPlayCard(pendingCardId, isHit);
      pendingCardId = null;
    }

    function sendPlayCard(cardId, qteSuccess = false) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'PLAY_CARD',
          payload: { cardId: cardId, qteSuccess: qteSuccess }
        }));
      }
    }

    function endTurn() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        qteModal.style.display = 'none';
        waterOverlay.style.display = 'none';
        stopSleepUI();
        clearInterval(floodIntervalId);
        if (qteAnimationId) cancelAnimationFrame(qteAnimationId);
        ws.send(JSON.stringify({ type: 'END_TURN' }));
      }
    }
  </script>
</body>
</html>
